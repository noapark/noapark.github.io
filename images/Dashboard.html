<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>AI 교사 연수 대시보드</title>

<script src="https://cdnjs.cloudflare.com/ajax/libs/react/18.3.1/umd/react.production.min.js" crossorigin></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/react-dom/18.3.1/umd/react-dom.production.min.js" crossorigin></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/babel-standalone/7.28.4/babel.min.js"></script>

<style>
  :root {
    --primary: #0b6b63;
    --primary-light: #e6f6f4;
    --primary-dark: #074742;
    --accent2: #f59e0b;
    --accent2-light: #fef3c7;
    --dark: #0f172a;
    --gray-text: #475569;
    --gray-light: #94a3b8;
    --card-bg: #ffffff;
    --bg-color: #f8fafc;
    --border-color: #e2e8f0;
    --sub: #64748b;
  }

  * { box-sizing: border-box; }

  body {
    font-family: 'Pretendard', sans-serif;
    background: var(--bg-color);
    color: var(--dark);
    line-height: 1.7;
    letter-spacing: -0.02em;
    -webkit-font-smoothing: antialiased;
  }

  .container {
    max-width: 1140px;
    margin: 0 auto;
    padding: 0 24px;
  }

  .site-header {
    position: sticky;
    top: 0;
    z-index: 100;
    background: rgba(255, 255, 255, 0.85);
    backdrop-filter: blur(12px);
    -webkit-backdrop-filter: blur(12px);
    border-bottom: 1px solid var(--border-color);
    transition: all 0.3s ease;
  }

  .site-header .container {
    display: flex;
    justify-content: space-between;
    align-items: center;
    height: 76px;
  }

  .logo {
    font-weight: 800;
    font-size: 24px;
    color: var(--primary);
    cursor: pointer;
    letter-spacing: -0.05em;
    transition: transform 0.2s;
  }
  .logo:hover { transform: scale(1.05); }

  .nav ul { display: flex; gap: 10px; list-style: none; }

  .nav a {
    cursor: pointer;
    text-decoration: none;
    color: var(--gray-text);
    font-size: 15px;
    font-weight: 600;
    padding: 10px 18px;
    border-radius: 10px;
    transition: all 0.25s cubic-bezier(0.4, 0, 0.2, 1);
  }
  .nav a:hover, .nav a.active {
    color: var(--primary);
    background: var(--primary-light);
  }

  .kpi-grid {
    display: grid;
    grid-template-columns: repeat(2, 1fr);
    gap: 14px;
    margin: 24px 0;
  }
  @media (min-width: 760px) {
    .kpi-grid { grid-template-columns: repeat(4, 1fr); }
  }

  .card {
    background: var(--card-bg);
    border: 1px solid var(--border-color);
    border-radius: 18px;
    box-shadow: 0 1px 2px rgba(15, 23, 42, 0.04);
  }

  .kpi-card { padding: 18px; display: flex; flex-direction: column; gap: 8px; }
  .kpi-top { display: flex; align-items: center; justify-content: space-between; }
  .kpi-label { font-size: 13px; font-weight: 500; color: var(--sub); }
  .kpi-icon {
    width: 34px; height: 34px; border-radius: 11px;
    display: flex; align-items: center; justify-content: center;
    flex-shrink: 0;
  }
  .kpi-value { font-size: 28px; font-weight: 800; line-height: 1.1; color: var(--dark); }
  .kpi-sub { font-size: 11.5px; color: var(--gray-light); }

  .tabs { display: flex; flex-wrap: wrap; gap: 8px; margin-bottom: 16px; }
  .tab-btn {
    border: 1px solid var(--border-color);
    background: #fff;
    color: var(--gray-text);
    font-size: 13px;
    font-weight: 600;
    padding: 9px 16px;
    border-radius: 999px;
    cursor: pointer;
    transition: all 0.15s ease;
  }
  .tab-btn:hover { background: #f1f5f9; }
  .tab-btn.active {
    background: var(--primary);
    border-color: var(--primary);
    color: #fff;
    box-shadow: 0 2px 6px rgba(11, 107, 99, 0.25);
  }

  .chart-card { padding: 20px; margin-bottom: 24px; }
  .chart-title { font-size: 14px; font-weight: 700; color: var(--gray-text); margin: 0 0 14px; }
  .chart-scroll { width: 100%; overflow-x: auto; }
  .legend { display: flex; gap: 18px; justify-content: center; margin-top: 10px; flex-wrap: wrap; }
  .legend-item { display: flex; align-items: center; gap: 6px; font-size: 12px; color: var(--sub); }
  .legend-dot { width: 10px; height: 10px; border-radius: 50%; display: inline-block; }

  .overview-grid { display: grid; grid-template-columns: 1fr; gap: 28px; }
  @media (min-width: 760px) {
    .overview-grid { grid-template-columns: 1fr 1fr; }
  }

  .bar:hover { opacity: 0.85; }
  .pie-slice { transition: transform 0.15s ease; transform-origin: center; cursor: default; }
  .pie-slice:hover { transform: scale(1.035); }

  .bottom-grid { display: grid; grid-template-columns: 1fr; gap: 20px; margin-top: 24px; }
  @media (min-width: 760px) {
    .bottom-grid { grid-template-columns: 1fr 1fr; }
  }
  .section-card { padding: 20px; }
  .section-title {
    display: flex; align-items: center; gap: 8px;
    font-size: 14px; font-weight: 700; color: var(--gray-text);
    margin: 0 0 14px;
  }
  .tag-wrap { display: flex; flex-wrap: wrap; gap: 8px; }
  .tag {
    background: var(--primary-light);
    color: var(--primary-dark);
    font-size: 12px; font-weight: 600;
    padding: 6px 13px; border-radius: 999px;
  }
  .feedback-list { display: flex; flex-direction: column; gap: 10px; }
  .feedback-item {
    background: var(--bg-color);
    border: 1px solid var(--border-color);
    border-radius: 13px;
    padding: 12px 14px;
    font-size: 14.5px;
    color: var(--gray-text);
    line-height: 1.5;
  }
  .feedback-id { font-weight: 700; color: var(--gray-light); margin-right: 8px; }

  /* ── 매트릭스 테이블 ── */
  .metrics-table {
    width: 100%;
    border-collapse: collapse;
    font-size: 13.5px;
  }
  .metrics-table th {
    background: var(--primary-light);
    color: var(--primary-dark);
    font-weight: 700;
    padding: 10px 14px;
    text-align: left;
    border-bottom: 2px solid var(--primary);
  }
  .metrics-table td {
    padding: 10px 14px;
    border-bottom: 1px solid var(--border-color);
    color: var(--gray-text);
    vertical-align: middle;
  }
  .metrics-table tr:last-child td { border-bottom: none; }
  .metrics-table tr:hover td { background: var(--bg-color); }

  .bar-track {
    background: var(--border-color);
    border-radius: 999px;
    height: 10px;
    width: 100%;
    overflow: hidden;
  }
  .bar-fill {
    height: 10px;
    border-radius: 999px;
    transition: width 0.4s ease;
  }
  .score-badge {
    display: inline-block;
    font-weight: 800;
    font-size: 15px;
    color: var(--dark);
    min-width: 32px;
    text-align: right;
  }

  .footnote { text-align: center; font-size: 11.5px; color: var(--gray-light); margin-top: 28px; }

  svg text { font-family: inherit; }

  .wrap { padding: 28px 24px 40px; max-width: 1140px; margin: 0 auto; }
  .header { margin-bottom: 8px; }
  .header h1 { font-size: 22px; font-weight: 800; margin: 0 0 4px; }
  .header p { font-size: 13px; color: var(--sub); margin: 0; }
</style>
</head>
<body>

<header class="site-header">
  <div class="container">
    <div class="logo">[]</div>
    <nav class="nav">
      <ul>
        <li><a href="https://noapark.github.io/index.html">강사 홈페이지</a></li>
        <li><a>대시보드</a></li>
      </ul>
    </nav>
  </div>
</header>

<div id="root"></div>

<script type="text/babel">
const { useState, useMemo } = React;

const rawData = [
  { id: 1, prior: 4, posterior: 5, awareness: 3, improvement: 5, program: "Gemini", requirement: "AI 활용", feedback: "실제 수업에 바로 적용할 수 있을 것 같습니다." },
  { id: 2, prior: 2, posterior: 4, awareness: 2, improvement: 4, program: "Gemini", requirement: "창의적 수업 자료", feedback: "자료를 만들 수 있어 유용했습니다" },
  { id: 3, prior: 4, posterior: 4, awareness: 4, improvement: 4, program: "GPT", requirement: "교육 자료 만들기", feedback: "" },
  { id: 4, prior: 4, posterior: 4, awareness: 4, improvement: 4, program: "AI", requirement: "수업 활용", feedback: "" },
  { id: 5, prior: 3, posterior: 3, awareness: 3, improvement: 4, program: "Gemini", requirement: "AI 활용 기본기", feedback: "" },
  { id: 6, prior: 5, posterior: 5, awareness: 3, improvement: 5, program: "Gemini", requirement: "통합교과 수업 자료 제작", feedback: "" },
  { id: 7, prior: 4, posterior: 5, awareness: 4, improvement: 5, program: "Gemini", requirement: "AI 전문성 역량 강화", feedback: "" },
  { id: 8, prior: 5, posterior: 5, awareness: 3, improvement: 5, program: "Gemini", requirement: "AI 활용", feedback: "AI활용법은 충분히 배웠습니다." },
  { id: 9, prior: 5, posterior: 5, awareness: 5, improvement: 5, program: "Gemini", requirement: "AI 기본", feedback: "활용은 실습이 더 필요합니다" },
  { id: 10, prior: 3, posterior: 3, awareness: 3, improvement: 5, program: "Gemini", requirement: "창의적 체험활동 수업 자료 제작", feedback: "" },
  { id: 11, prior: 4, posterior: 4, awareness: 4, improvement: 4, program: "Gemini", requirement: "교사 전문성 강화", feedback: "협업 내용 추가로 알려주셔서 좋았어요." },
  { id: 12, prior: 2, posterior: 5, awareness: 1, improvement: 5, program: "교육용 AI", requirement: "AI 윤리와 안전 활용", feedback: "" },
  { id: 13, prior: 4, posterior: 4, awareness: 4, improvement: 4, program: "Gemini", requirement: "수업 자료 제작", feedback: "" },
  { id: 14, prior: 3, posterior: 4, awareness: 4, improvement: 4, program: "Gemini", requirement: "실 생활 활용", feedback: "" },
];

const PROGRAM_COLORS = {
  Gemini: "#0b6b63",
  GPT: "#074742",
  AI: "#f59e0b",
  "교육용 AI": "#94a3b8",
};

function avg(arr, key) {
  return arr.reduce((s, d) => s + d[key], 0) / arr.length;
}

/* ── 아이콘 ── */
const IconBase = ({ children, color, size }) => (
  <svg width={size} height={size} viewBox="0 0 24 24" fill="none" stroke={color} strokeWidth="2" strokeLinecap="round" strokeLinejoin="round">
    {children}
  </svg>
);
const IconUsers = (p) => (
  <IconBase {...p}>
    <circle cx="9" cy="8" r="3.2" />
    <path d="M3.5 19c0-3 2.5-5 5.5-5s5.5 2 5.5 5" />
    <circle cx="17" cy="9" r="2.6" />
    <path d="M14.8 14.3c2.4.3 4.2 2.1 4.2 4.7" />
  </IconBase>
);
const IconTrend = (p) => (
  <IconBase {...p}>
    <path d="M3 17l5.5-6 4 3.5L21 6" />
    <path d="M15 6h6v6" />
  </IconBase>
);
const IconSpark = (p) => (
  <IconBase {...p}>
    <path d="M12 3l1.8 5.2L19 10l-5.2 1.8L12 17l-1.8-5.2L5 10l5.2-1.8z" />
    <path d="M19 16l.7 2 2 .7-2 .7-.7 2-.7-2-2-.7 2-.7z" />
  </IconBase>
);
const IconClipboard = (p) => (
  <IconBase {...p}>
    <rect x="5" y="4" width="14" height="17" rx="2" />
    <rect x="9" y="2.3" width="6" height="3.4" rx="1" />
    <path d="M8.5 11h7M8.5 14.5h7M8.5 18h4.5" />
  </IconBase>
);
const IconQuote = (p) => (
  <IconBase {...p}>
    <path d="M7 7c-2.2 0-3.5 1.6-3.5 4 0 2 1.2 3.4 3 3.4.4 2.6-1 4.4-3 5.1" />
    <path d="M16.5 7c-2.2 0-3.5 1.6-3.5 4 0 2 1.2 3.4 3 3.4.4 2.6-1 4.4-3 5.1" />
  </IconBase>
);

/* ── 공통 차트 유틸 ── */
function polar(cx, cy, r, angleDeg) {
  const a = ((angleDeg - 90) * Math.PI) / 180;
  return { x: cx + r * Math.cos(a), y: cy + r * Math.sin(a) };
}
function arcPath(cx, cy, rOuter, rInner, startAngle, endAngle) {
  const so = polar(cx, cy, rOuter, endAngle);
  const eo = polar(cx, cy, rOuter, startAngle);
  const si = polar(cx, cy, rInner, endAngle);
  const ei = polar(cx, cy, rInner, startAngle);
  const large = endAngle - startAngle <= 180 ? "0" : "1";
  return [
    "M", so.x, so.y,
    "A", rOuter, rOuter, 0, large, 0, eo.x, eo.y,
    "L", ei.x, ei.y,
    "A", rInner, rInner, 0, large, 1, si.x, si.y,
    "Z",
  ].join(" ");
}

/* ── 그룹 막대 차트 ── */
function GroupedBarChart({ data, keyA, keyB, labelA, labelB, colorA, colorB, max = 5 }) {
  const W = 760, H = 300;
  const margin = { top: 16, right: 16, bottom: 30, left: 28 };
  const plotW = W - margin.left - margin.right;
  const plotH = H - margin.top - margin.bottom;
  const n = data.length;
  const groupW = plotW / n;
  const barW = groupW * 0.32;
  const yFor = (v) => margin.top + plotH - (v / max) * plotH;
  const hFor = (v) => (v / max) * plotH;
  const gridVals = [0, 1, 2, 3, 4, 5];

  return (
    <div className="chart-scroll">
      <svg viewBox={`0 0 ${W} ${H}`} width="100%" style={{ minWidth: 560 }}>
        {gridVals.map((v) => (
          <g key={v}>
            <line x1={margin.left} x2={W - margin.right} y1={yFor(v)} y2={yFor(v)} stroke="#e2e8f0" strokeWidth="1" />
            <text x={margin.left - 8} y={yFor(v) + 4} fontSize="10" fill="#94a3b8" textAnchor="end">{v}</text>
          </g>
        ))}
        {data.map((d, i) => {
          const x0 = margin.left + i * groupW;
          const xA = x0 + groupW * 0.16;
          const xB = x0 + groupW * 0.52;
          return (
            <g key={i}>
              <rect className="bar" x={xA} y={yFor(d[keyA])} width={barW} height={hFor(d[keyA])} fill={colorA} rx="3">
                <title>{`${d.name} ${labelA}: ${d[keyA]}`}</title>
              </rect>
              <rect className="bar" x={xB} y={yFor(d[keyB])} width={barW} height={hFor(d[keyB])} fill={colorB} rx="3">
                <title>{`${d.name} ${labelB}: ${d[keyB]}`}</title>
              </rect>
              <text x={x0 + groupW / 2} y={H - margin.bottom + 16} fontSize="10" fill="#94a3b8" textAnchor="middle">{d.name}</text>
            </g>
          );
        })}
      </svg>
    </div>
  );
}

/* ── 도넛 차트 ── */
function DonutChart({ data, colors }) {
  const total = data.reduce((s, d) => s + d.value, 0);
  let cursor = 0;
  const cx = 140, cy = 140, rOuter = 110, rInner = 62;

  return (
    <div style={{ display: "flex", flexDirection: "column", alignItems: "center" }}>
      <svg viewBox="0 0 280 280" width="100%" style={{ maxWidth: 280 }}>
        {data.map((d, i) => {
          const angle = (d.value / total) * 360;
          const start = cursor;
          const end = cursor + angle;
          cursor = end;
          const fill = colors[d.name] || "#94a3b8";
          return (
            <path key={i} className="pie-slice" d={arcPath(cx, cy, rOuter, rInner, start, end)} fill={fill}>
              <title>{`${d.name}: ${d.value}명`}</title>
            </path>
          );
        })}
        <text x={cx} y={cy - 4} textAnchor="middle" fontSize="22" fontWeight="800" fill="#0f172a">{total}</text>
        <text x={cx} y={cy + 16} textAnchor="middle" fontSize="11" fill="#94a3b8">전체 응답 14/30명 결측치제외</text>
      </svg>
      <div className="legend">
        {data.map((d, i) => (
          <span className="legend-item" key={i}>
            <span className="legend-dot" style={{ background: colors[d.name] || "#94a3b8" }} />
            {d.name} ({d.value})
          </span>
        ))}
      </div>
    </div>
  );
}

/* ── 매트릭스 차트 (레이더 차트 대체) ── */
function MetricsMatrix({ metrics, max = 5 }) {
  const METRIC_COLORS = {
    "사전 경험":  { bar: "#a7d8d3", badge: "#0b6b63" },
    "사후 경험":  { bar: "#0b6b63", badge: "#074742" },
    "사전 인지도": { bar: "#fcd9a0", badge: "#d97706" },
    "사후 개선도": { bar: "#f59e0b", badge: "#92400e" },
  };

  return (
    <table className="metrics-table">
      <thead>
        <tr>
          <th style={{ width: "30%" }}>지표</th>
          <th style={{ width: "15%", textAlign: "right" }}>평균</th>
          <th style={{ width: "15%", textAlign: "right" }}>참여자 응답</th>
          <th>...</th> 
        </tr>
      </thead>
      <tbody>
        {metrics.map((m, i) => {
          const pct = (m.value / max) * 100;
          const colors = METRIC_COLORS[m.metric] || { bar: "#94a3b8", badge: "#475569" };
          return (
            <tr key={i}>
              <td style={{ fontWeight: 600, color: "var(--dark)" }}>{m.metric}</td>
              <td style={{ textAlign: "right" }}>
                <span className="score-badge" style={{ color: colors.badge }}>
                  {m.value.toFixed(2)}
                </span>
              </td>
              <td style={{ textAlign: "right", fontWeight: 600, color: colors.badge }}>
                {pct.toFixed(0)}%
              </td>
              <td>
                <div className="bar-track">
                  <div
                    className="bar-fill"
                    style={{ width: `${pct}%`, background: colors.bar }}
                  />
                </div>
              </td>
            </tr>
          );
        })}
      </tbody>
    </table>
  );
}

/* ── 메인 대시보드 ── */
function Dashboard() {
  const [tab, setTab] = useState("experience");

  const stats = useMemo(() => {
    const priorAvg = avg(rawData, "prior");
    const postAvg = avg(rawData, "posterior");
    const awareAvg = avg(rawData, "awareness");
    const impAvg = avg(rawData, "improvement");
    const programCounts = {};
    rawData.forEach((d) => { programCounts[d.program] = (programCounts[d.program] || 0) + 1; });
    const programData = Object.entries(programCounts).map(([name, value]) => ({ name, value }));
    const improved = rawData.filter((d) => d.posterior > d.prior).length;
    const maxed = rawData.filter((d) => d.posterior === 5).length;
    return { priorAvg, postAvg, awareAvg, impAvg, programData, improved, maxed };
  }, []);

  const expChartData  = rawData.map((d) => ({ name: `${d.id}번`, prior: d.prior, posterior: d.posterior }));
  const awareChartData = rawData.map((d) => ({ name: `${d.id}번`, awareness: d.awareness, improvement: d.improvement }));

  const matrixMetrics = [
    { metric: "사전 경험",  value: stats.priorAvg },
    { metric: "사후 경험",  value: stats.postAvg },
    { metric: "사전 인지도", value: stats.awareAvg },
    { metric: "사후 개선도", value: stats.impAvg },
  ];

  const feedbacks    = rawData.filter((d) => d.feedback.trim().length > 0);
  const requirements = rawData.map((d) => d.requirement);

  const KpiCard = ({ Icon, label, value, sub, accent }) => (
    <div className="card kpi-card">
      <div className="kpi-top">
        <span className="kpi-label">{label}</span>
        <div className="kpi-icon" style={{ background: accent + "1a" }}>
          <Icon color={accent} size={17} />
        </div>
      </div>
      <div className="kpi-value">{value}</div>
      {sub && <div className="kpi-sub">{sub}</div>}
    </div>
  );

  const TabButton = ({ id, label }) => (
    <button className={`tab-btn ${tab === id ? "active" : ""}`} onClick={() => setTab(id)}>
      {label}
    </button>
  );

  return (
    <div className="wrap">
      <div className="header">
        <h1>생성형 AI 실습 만족도 _교사 연수</h1>
        <p>2026.05.11 진행 · 응답자 {rawData.length}명 · 사전·사후 설문 비교 _ 30명 중 결측치 제외</p>
      </div>

      <div className="kpi-grid">
        <KpiCard Icon={IconUsers}    label="평균 사전 경험"    value={stats.priorAvg.toFixed(2)} sub="5점 만점"                                                  accent="#0b6b63" />
        <KpiCard Icon={IconTrend}    label="평균 사후 경험"    value={stats.postAvg.toFixed(2)}  sub={`사전 대비 +${(stats.postAvg - stats.priorAvg).toFixed(2)}`} accent="#074742" />
        <KpiCard Icon={IconSpark}    label="경험 향상 응답자"  value={`${stats.improved}명`}     sub={`전체의 ${Math.round((stats.improved / rawData.length) * 100)}%`} accent="#f59e0b" />
        <KpiCard Icon={IconClipboard} label="만점(5점) 도달"  value={`${stats.maxed}명`}        sub="사후 경험 기준"                                              accent="#64748b" />
      </div>

      <div className="tabs">
        <TabButton id="overview"    label="요구사항" />
        <TabButton id="experience"  label="사전·사후 경험 비교" />
        <TabButton id="awareness"   label="인지도 · 개선도" />
      </div>

      <div className="card chart-card">
        {tab === "experience" && (
          <>
            <h2 className="chart-title">응답자별 사전 vs 사후 경험 수준</h2>
            <GroupedBarChart data={expChartData} keyA="prior" keyB="posterior" labelA="사전" labelB="사후" colorA="#a7d8d3" colorB="#0b6b63" />
            <div className="legend">
              <span className="legend-item"><span className="legend-dot" style={{ background: "#a7d8d3" }} />사전</span>
              <span className="legend-item"><span className="legend-dot" style={{ background: "#0b6b63" }} />사후</span>
            </div>
          </>
        )}

        {tab === "awareness" && (
          <>
            <h2 className="chart-title">응답자별 사전 인지도 vs 사후 개선도</h2>
            <GroupedBarChart data={awareChartData} keyA="awareness" keyB="improvement" labelA="사전 인지도" labelB="사후 개선도" colorA="#fcd9a0" colorB="#f59e0b" />
            <div className="legend">
              <span className="legend-item"><span className="legend-dot" style={{ background: "#fcd9a0" }} />사전 인지도</span>
              <span className="legend-item"><span className="legend-dot" style={{ background: "#f59e0b" }} />사후 개선도</span>
            </div>
          </>
        )}

        {tab === "overview" && (
          <div className="overview-grid">
            <div>
              <h2 className="chart-title">사용 프로그램 분포</h2>
              <DonutChart data={stats.programData} colors={PROGRAM_COLORS} />
            </div>
            <div>
              <h2 className="chart-title">4개 지표 종합 평균 (5점 만점)</h2>
              <MetricsMatrix metrics={matrixMetrics} />
            </div>
          </div>
        )}
      </div>

      <div className="bottom-grid">
        <div className="card section-card">
          <h2 className="section-title"><IconClipboard color="#0b6b63" size={16} />연수 요구사항 (사전 응답)</h2>
          <div className="tag-wrap">
            {requirements.map((r, i) => <span className="tag" key={i}>{r}</span>)}
          </div>
        </div>

        <div className="card section-card">
          <h2 className="section-title"><IconQuote color="#0b6b63" size={16} />연수 후기 (사후 응답) ({feedbacks.length}건)</h2>
          <div className="feedback-list">
            {feedbacks.map((f) => (
              <div className="feedback-item" key={f.id}>
                <span className="feedback-id">#{f.id}</span>{f.feedback}
              </div>
            ))}
          </div>
        </div>
      </div>

      <p className="footnote">
        ※ 사용 프로그램 생성형 AI의 "제미나이/geminai/재미나이" 등 표기 변형은 모두 Gemini로 통합 집계했습니다.
      </p>
    </div>
  );
}

ReactDOM.createRoot(document.getElementById("root")).render(<Dashboard />);
</script>
</body>
</html>
