<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Noa Park | 융합 강사</title>

<link href="https://fonts.googleapis.com/css2?family=Pretendard:wght@400;600;700&display=swap" rel="stylesheet">

<style>
*, *::before, *::after {
  box-sizing: border-box;
  margin: 0;
  padding: 0;
}

:root {
  --primary: #4F46E5;
  --primary-light: #EEF2FF;
  --dark: #1E293B;
  --gray-text: #64748B;
  --card-bg: #FFFFFF;
  --bg-color: #F8FAFC;
  --border-color: #E2E8F0;
}  

body {
  font-family: 'Pretendard', sans-serif;
  background: var(--bg-color);
  color: var(--dark);
  line-height: 1.6;
}

.container {
  max-width: 1100px;
  margin: auto;
  padding: 0 20px;
}

/* HEADER */
.site-header {
  background: rgba(255, 255, 255, 0.8);
  backdrop-filter: blur(10px);
  position: sticky;
  top: 0; 
  z-index: 100;
  border-bottom: 1px solid var(--border-color);
}

.site-header .container {
  display: flex;
  justify-content: space-between;
  align-items: center;
  height: 70px;
}

.logo {
  font-weight: 700;
  font-size: 22px;
  color: var(--primary);
  cursor: pointer;
}

.nav ul {
  display: flex;
  gap: 10px;
  list-style: none;
}

.nav a {
  cursor: pointer;
  text-decoration: none;
  color: var(--gray-text);
  font-weight: 600;
  padding: 8px 16px;
  border-radius: 8px;
}

.nav a.active {
  color: var(--primary);
  background: var(--primary-light);
}

/* PAGE */
.page {
  display: none;
  opacity: 0;
  transform: translateY(15px);
  transition: all .35s ease; /* ✅ 수정 */
}

.page.active {
  display: block;
  opacity: 1;
  transform: translateY(0);
}

/* SECTION */
.section {
  padding: 60px 0;
  text-align: center;
}

/* GRID */
.projects-grid {
  display: grid;
  grid-template-columns: repeat(auto-fit, minmax(300px, 1fr));
  gap: 30px;
}

.project-card {
  background: #fff;
  padding: 30px;
  border-radius: 20px;
}

.mini-card {
  padding: 15px;
  background: #f8fafc;
  border-radius: 10px;
  margin-top: 10px;
  cursor: pointer;
}

/* MODAL */
.modal {
  display: none;
  position: fixed;
  inset: 0;
  background: rgba(0,0,0,0.5);
  justify-content: center;
  align-items: center;
}

.modal-content {
  background: #fff;
  padding: 30px;
  max-width: 600px;
}

#toast {
  position: fixed;
  bottom: 30px;
  left: 50%;
  transform: translateX(-50%);
  background: #111;
  color: #fff;
  padding: 12px 20px;
  border-radius: 10px;
  display: none;
}
</style>
</head>

<body>

<header class="site-header">
  <div class="container">
    <div class="logo" onclick="showToast('만나서 반갑습니다!')">[]</div>
    <nav class="nav">
      <ul>
        <li><a class="active" onclick="goPage('home', this)">소개</a></li>
        <li><a onclick="goPage('courses', this)">강의</a></li>
        <li><a onclick="goPage('instructors', this)">강사</a></li>
        <li><a onclick="goPage('contact', this)">문의</a></li>
      </ul>
    </nav>
  </div>
</header>

<div class="page active" id="page-home">
  <div class="container">
    <section class="section">
      <h1>Learn Smarter, Build Faster 🚀</h1>
    </section>
  </div>
</div>

<div class="page" id="page-courses">
  <div class="container">
    <section class="section">

      <div class="projects-grid">
        <div class="project-card" id="auto">
          <h3>업무 자동화</h3>
          <div class="items"></div>
        </div>

        <div class="project-card" id="physical">
          <h3>피지컬 컴퓨팅</h3>
          <div class="items"></div>
        </div>

        <div class="project-card" id="blockcording">
          <h3>블록코딩</h3>
          <div class="items"></div>
        </div>

        <div class="project-card" id="portfolio">
          <h3>포트폴리오</h3>
          <div class="items"></div>
        </div>
      </div>

    </section>
  </div>
</div>

<div class="page" id="page-instructors">
  <div class="container">
    <section class="section">
      <div id="instructorCard"></div>
    </section>
  </div>
</div>

<div class="page" id="page-contact">
  <div class="container">
    <section class="section">
      Contact
    </section>
  </div>
</div>

<div id="modal" class="modal">
  <div class="modal-content">
    <span onclick="modal.style.display='none'">닫기</span>
    <h2 id="modalTitle"></h2>
    <p id="modalDesc"></p>
  </div>
</div>

<div id="toast"></div>

<script>
/* ✅ container 수정 */
const containers = {
  ai: document.querySelector("#auto .items"),
  block: document.querySelector("#physical .items"),
  blockcording: document.querySelector("#blockcording .items"),
  design: document.querySelector("#portfolio .items")
};

const posts = [
  {cat:"ai", title:"자동화"},
  {cat:"block", title:"로봇"},
  {cat:"blockcording", title:"게임"},
  {cat:"design", title:"디자인"}
];

posts.forEach(post => {
  const card = document.createElement("div");
  card.className = "mini-card";
  card.innerText = post.title;

  if (containers[post.cat]) {
    containers[post.cat].appendChild(card);
  }
});

/* 페이지 전환 */
function goPage(page, el) {
  document.querySelectorAll(".page").forEach(p => p.classList.remove("active"));
  document.getElementById("page-" + page).classList.add("active");

  document.querySelectorAll(".nav a").forEach(a => a.classList.remove("active"));
  el.classList.add("active");
}

/* 토스트 */
function showToast(msg) {
  const t = document.getElementById("toast");
  t.innerText = msg;
  t.style.display = "block";
  setTimeout(()=> t.style.display="none", 2000);
}
</script>

</body>
</html>
